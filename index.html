<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>紫微斗数研究排盘</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    background:
        radial-gradient(
            circle at top,
            #fffdf8 0,
            #f5eee3 45%,
            #eee5d8 100%
        );

    color:#2c251e;

    font-family:
        "Noto Serif SC",
        "Songti SC",
        "STSong",
        "Microsoft YaHei",
        serif;

    line-height:1.6;
}


/* =========================================================
   基础
   ========================================================= */

.page{

    width:min(1450px,96vw);

    margin:30px auto 80px;

}

.header{

    text-align:center;

    margin-bottom:25px;

}

.header h1{

    margin:0;

    font-size:32px;

    letter-spacing:4px;

    color:#4e3020;

}

.header p{

    margin:8px 0 0;

    color:#857365;

    font-size:14px;

}

.disclaimer{

    background:#fff8e9;

    border:1px solid #e7c98e;

    border-left:5px solid #b38345;

    padding:13px 18px;

    border-radius:8px;

    font-size:13px;

    color:#725b3f;

    margin-bottom:20px;

}


/* =========================================================
   卡片
   ========================================================= */

.card{

    background:rgba(255,255,255,.96);

    border:1px solid #dfd3c4;

    border-radius:12px;

    box-shadow:
        0 5px 20px rgba(80,50,20,.07);

    padding:22px;

    margin-bottom:20px;

}

.card-title{

    color:#70482f;

    font-size:20px;

    font-weight:bold;

    border-bottom:1px solid #e7ddd2;

    padding-bottom:10px;

    margin-bottom:18px;

}


/* =========================================================
   输入
   ========================================================= */

.input-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;

}

.field label{

    display:block;

    margin-bottom:6px;

    color:#604a3b;

    font-size:14px;

}

.field input,
.field select{

    width:100%;

    height:42px;

    border:1px solid #d8c8b8;

    border-radius:7px;

    padding:0 11px;

    background:#fffdfb;

    color:#30271f;

    font-size:14px;

    outline:none;

}

.field input:focus,
.field select:focus{

    border-color:#a87648;

    box-shadow:
        0 0 0 2px rgba(168,118,72,.12);

}

.sub-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin-top:15px;

}

.btn{

    border:0;

    border-radius:8px;

    padding:12px 22px;

    cursor:pointer;

    font-family:inherit;

    font-size:15px;

    transition:.15s;

}

.btn-primary{

    background:#70442c;

    color:white;

}

.btn-primary:hover{

    background:#5d3622;

}

.btn-secondary{

    background:#eee3d7;

    color:#5c4435;

}

.button-row{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-top:18px;

}


/* =========================================================
   状态
   ========================================================= */

.status{

    margin-top:15px;

    padding:11px 14px;

    border-radius:7px;

    background:#f7f3ee;

    color:#806e60;

    font-size:13px;

}

.status.error{

    background:#fff0ee;

    color:#a13b2c;

    border:1px solid #efc0b8;

}

.status.ok{

    background:#eff8ee;

    color:#49733e;

    border:1px solid #c8e1c1;

}


/* =========================================================
   命盘
   ========================================================= */

.chart-wrapper{

    overflow-x:auto;

    padding:10px 0 20px;

}

.ziwei-grid{

    min-width:850px;

    width:100%;

    aspect-ratio:1 / .76;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    grid-template-rows:
        repeat(4,1fr);

    gap:3px;

    background:#8c6a4e;

    border:5px solid #745238;

    border-radius:8px;

    overflow:hidden;

}


/* 四周十二宫 */

.palace{

    background:#fffdf8;

    border:1px solid #d9cbbd;

    padding:8px;

    cursor:pointer;

    position:relative;

    min-width:0;

    transition:.15s;

}

.palace:hover{

    background:#fff6e7;

}

.palace.selected{

    background:#fff0ce;

    box-shadow:
        inset 0 0 0 3px #ad7740;

}

.palace.highlight{

    background:#f5eee5;

}


/* 中央 */

.center{

    grid-column:2 / 4;

    grid-row:2 / 4;

    background:
        linear-gradient(
            135deg,
            #f8f0e5,
            #fffaf3
        );

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:20px;

}

.center-title{

    font-size:21px;

    font-weight:bold;

    color:#67442f;

    margin-bottom:10px;

}

.center-info{

    font-size:13px;

    color:#756455;

    line-height:1.9;

}

.center-tip{

    margin-top:15px;

    color:#9a775c;

    font-size:12px;

}


/* 宫位 */

.palace-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.palace-name{

    font-size:17px;

    font-weight:bold;

    color:#5d3e2c;

}

.branch{

    color:#9a7860;

    font-size:12px;

}

.stem{

    color:#9a7860;

    font-size:11px;

}

.stars{

    margin-top:7px;

}

.star{

    display:inline-block;

    margin:2px 4px 2px 0;

    color:#5b201a;

    font-size:17px;

    font-weight:bold;

}

.star.minor{

    color:#506a4b;

    font-size:12px;

    font-weight:normal;

}

.star.adjective{

    color:#777;

    font-size:11px;

}

.star.transform{

    color:#9a542f;

}

.brightness{

    display:inline-block;

    margin-left:3px;

    font-size:10px;

    color:#9a7b65;

    font-weight:normal;

}

.palace-footer{

    position:absolute;

    left:8px;

    right:8px;

    bottom:5px;

    font-size:10px;

    color:#9d8979;

}


/* =========================================================
   运限
   ========================================================= */

.horizon{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;

}

.horizon-item{

    background:#faf6f0;

    border:1px solid #e1d5c7;

    border-radius:8px;

    padding:13px;

}

.horizon-item strong{

    color:#67432f;

}

.tag{

    display:inline-block;

    padding:3px 7px;

    border-radius:5px;

    background:#eadbc9;

    color:#70543e;

    font-size:11px;

    margin:2px;

}


/* =========================================================
   分析
   ========================================================= */

.analysis-layout{

    display:grid;

    grid-template-columns:300px 1fr;

    gap:18px;

}

.palace-menu{

    max-height:600px;

    overflow:auto;

    border:1px solid #e2d6ca;

    border-radius:8px;

}

.menu-item{

    padding:10px 12px;

    border-bottom:1px solid #eee5dc;

    cursor:pointer;

    background:#fff;

}

.menu-item:hover{

    background:#faf3ea;

}

.menu-item.active{

    background:#ead7c2;

    color:#5b3826;

    font-weight:bold;

}

.analysis{

    min-height:500px;

}

.analysis-title{

    font-size:25px;

    color:#633d28;

    margin-bottom:4px;

}

.analysis-subtitle{

    color:#907b6b;

    font-size:13px;

    margin-bottom:18px;

}

.section{

    margin-bottom:22px;

}

.section h3{

    color:#70472f;

    font-size:17px;

    margin:0 0 9px;

}

.evidence{

    display:flex;

    flex-wrap:wrap;

    gap:6px;

    margin:8px 0;

}

.evidence span{

    padding:4px 8px;

    background:#f1e7db;

    border-radius:5px;

    color:#72513c;

    font-size:12px;

}

.plain{

    background:#fbf7f2;

    border-left:4px solid #b48455;

    padding:13px 15px;

    border-radius:5px;

    color:#4e4137;

}

.warning-box{

    background:#fff7f3;

    border:1px solid #efd1c4;

    padding:12px 14px;

    border-radius:7px;

    color:#875b4d;

}


/* =========================================================
   四化
   ========================================================= */

.trans-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;

}

.trans-card{

    padding:14px;

    border-radius:8px;

    background:#faf6f1;

    border:1px solid #e3d8cc;

}

.trans-card h4{

    margin:0 0 7px;

    color:#6d432b;

}

.trans-card p{

    margin:0;

    font-size:13px;

}


/* =========================================================
   表格
   ========================================================= */

.data-table{

    width:100%;

    border-collapse:collapse;

    font-size:13px;

}

.data-table th,
.data-table td{

    padding:9px;

    border-bottom:1px solid #e5ddd5;

    text-align:left;

}

.data-table th{

    color:#67442f;

    background:#f7f1ea;

}


/* =========================================================
   响应式
   ========================================================= */

@media(max-width:900px){

    .input-grid{

        grid-template-columns:
            repeat(2,1fr);

    }

    .analysis-layout{

        grid-template-columns:1fr;

    }

    .horizon{

        grid-template-columns:
            repeat(2,1fr);

    }

    .trans-grid{

        grid-template-columns:
            repeat(2,1fr);

    }

}

@media(max-width:600px){

    .page{

        width:96vw;

        margin-top:15px;

    }

    .header h1{

        font-size:24px;

    }

    .input-grid,
    .sub-grid{

        grid-template-columns:1fr;

    }

    .horizon,
    .trans-grid{

        grid-template-columns:1fr;

    }

    .ziwei-grid{

        min-width:760px;

    }

}

</style>

</head>


<body>


<div class="page">


<!-- =======================================================
     HEADER
======================================================= -->

<div class="header">

<h1>紫微斗数 · 研究排盘</h1>

<p>
本命｜三方四正｜四化｜自化｜大限｜流年｜主题宫重新布盘

<div class="disclaimer">

本网站仅为传统文化紫微斗数研究、娱乐参考，

<!-- =======================================================

<!-- =======================================================

<script>

/* ==========================================================
   全局
========================================================== */

"use strict";


let ASTRO = null;

let HOROSCOPE = null;

let CURRENT_TARGET = null;


/* ==========================================================
   中文名称
========================================================== */

const PALACE_NAMES = [

    "命宫",
    "兄弟",
    "夫妻",
    "子女",
    "财帛",
    "疾厄",
    "迁移",
    "仆役",
    "官禄",
    "田宅",
    "福德",
    "父母"

];


const PALACE_DESC = {

    "命宫":
        "本人性格、行为模式、天赋与人生基本取向。",

    "兄弟":
        "兄弟姐妹、同辈关系、合作伙伴。",

    "夫妻":
        "感情关系、婚姻互动、配偶主题。",

    "子女":
        "子女、晚辈、创造力、成果。",

    "财帛":
        "收入、财富运用、赚钱方式。",

    "疾厄":
        "身体状态、压力负荷与生活习惯。",

    "迁移":
        "外部环境、出行、社会舞台。",

    "仆役":
        "朋友、同事、团队、合作关系。",

    "官禄":
        "事业、工作、职位、社会角色。",

    "田宅":
        "家庭、居所、不动产与积累。",

    "福德":
        "精神状态、享受方式、内在满足感。",

    "父母":
        "长辈、学习、文书、制度资源。"

};


/* ==========================================================
   星曜关键词
========================================================== */

const STAR_KEYWORDS = {

    "紫微":
        "主导、整合、责任、掌控全局",

    "天机":
        "思考、变化、策划、信息流动",

    "太阳":
        "公开、表达、承担、外部影响",

    "武曲":
        "执行、资源、效率、现实成果",

    "天同":
        "缓冲、享受、协调、顺势",

    "廉贞":
        "原则、边界、欲望、关系规则",

    "天府":
        "稳定、管理、资源、储备",

    "太阴":
        "内在、细节、积累、情绪与安全感",

    "贪狼":
        "社交、欲望、拓展、兴趣",

    "巨门":
        "语言、辨析、观点、争议",

    "天相":
        "协调、规则、关系、辅助",

    "天梁":
        "责任、照顾、原则、保护",

    "七杀":
        "决断、压力、变化、竞争",

    "破军":
        "重整、突破、旧新转换"

};


/* ==========================================================
   四化
========================================================== */

const MUTAGEN_DESC = {

    "禄":
        "传统象征资源、机会、获得感与吸引力。",

    "权":
        "传统象征控制、推动、竞争、责任与决策。",

    "科":
        "传统象征名声、秩序、表现、资格与可见度。",

    "忌":
        "传统象征摩擦、压力、执着、阻滞与过度关注。"

};


const MUTAGEN_COLOR = {

    "禄":"#8c5a25",

    "权":"#75452e",

    "科":"#496a4d",

    "忌":"#9a3f35"

};


/* ==========================================================
   工具
========================================================== */

function nameOf(obj){

    if(!obj)
        return "未知";

    if(typeof obj === "string")
        return obj;

    return obj.name || "未知";

}


function safeArray(value){

    return Array.isArray(value)
        ? value
        : [];

}


function mod12(n){

    return ((n % 12) + 12) % 12;

}


/* ==========================================================
   时辰
========================================================== */

function hourToTimeIndex(hour){

    hour = Number(hour);

    if(hour === 0)
        return 0;

    if(hour === 23)
        return 12;

    return Math.floor((hour + 1) / 2);

}


/* ==========================================================
   宫位
========================================================== */

function palaceAt(index){

    if(!ASTRO || !ASTRO.palaces)
        return null;

    return ASTRO.palaces[
        mod12(index)
    ];

}


function palaceIndex(palace){

    if(!palace)
        return -1;

    return ASTRO.palaces.indexOf(palace);

}


/* ==========================================================
   三方四正
========================================================== */

function sanFangSiZheng(index){

    return [

        mod12(index),

        mod12(index + 4),

        mod12(index + 8),

        mod12(index + 6)

    ];

}


/* ==========================================================
   “某宫作为命宫”
   
   宫名重新排列：
   
   selected = 新命宫
   
   selected-1 = 新兄弟
   selected-2 = 新夫妻
   ...
========================================================== */

function virtualPalaces(selectedIndex){

    const result = {};

    PALACE_NAMES.forEach(
        (name, k) => {

            const idx =
                mod12(
                    selectedIndex - k
                );

            result[name] = {

                index:idx,

                palace:palaceAt(idx)

            };

        }
    );

    return result;

}


/* ==========================================================
   星曜
========================================================== */

function allStars(palace){

    if(!palace)
        return [];

    return [

        ...safeArray(palace.majorStars),

        ...safeArray(palace.minorStars),

        ...safeArray(palace.adjectiveStars)

    ];

}


function majorStars(palace){

    return safeArray(
        palace?.majorStars
    );

}


function minorStars(palace){

    return safeArray(
        palace?.minorStars
    );

}


/* ==========================================================
   星曜文字
========================================================== */

function starText(star){

    const n = nameOf(star);

    const key =
        STAR_KEYWORDS[n]
        || "该星需要结合宫位、亮度、辅星及四化综合判断。";

    return key;

}


/* ==========================================================
   四化来源
========================================================== */

function getStarMutagen(star){

    if(!star)
        return "";

    return star.mutagen || "";

}


function palaceMutagens(palace){

    const result = [];

    allStars(palace).forEach(
        star => {

            const m =
                getStarMutagen(star);

            if(m){

                result.push({

                    mutagen:m,

                    star:nameOf(star),

                    palace:nameOf(palace)

                });

            }

        }
    );

    return result;

}


/* ==========================================================
   本命四化
========================================================== */

function getNatalMutagens(){

    const result = {

        "禄":[],

        "权":[],

        "科":[],

        "忌":[]

    };

    ASTRO.palaces.forEach(
        palace => {

            allStars(palace).forEach(
                star => {

                    const m =
                        getStarMutagen(star);

                    if(
                        m &&
                        result[m]
                    ){

                        result[m].push({

                            star:nameOf(star),

                            palace:nameOf(palace)

                        });

                    }

                }
            );

        }
    );

    return result;

}


/* ==========================================================
   状态
========================================================== */

/* ==========================================================
   排盘
========================================================== */

function buildChart(){

    const chart =
        document.getElementById(
            "chart"
        );

    chart.innerHTML = "";


    /*
       传统 4×4 布局：

       3 4 5 6
       2 C C 7
       1 C C 8
       0 11 10 9
    */

    const positions = [

        3,4,5,6,
        2,"C","C",7,
        1,"C","C",8,
        0,11,10,9

    ];


    positions.forEach(
        (idx) => {

            if(idx === "C"){

                /*
                   只有第一个 C 创建中央区
                */

                if(
                    chart.querySelector(
                        ".center"
                    )
                ){

                    return;

                }


                const center =
                    document.createElement(
                        "div"
                    );

                center.className =
                    "center";

                center.innerHTML = `

                    <div class="center-title">
                        紫微斗数命盘
                    </div>

                    <div
                        class="center-info"
                        id="centerInfo"
                    >
                    </div>

                    <div class="center-tip">
                        点击任意宫位进入主题分析
                    </div>

                `;

                chart.appendChild(
                    center
                );

                return;

            }


            const palace =
                palaceAt(idx);

            if(!palace)
                return;


            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "palace";

            div.dataset.index =
                idx;


            const majors =
                majorStars(palace);


            const minors =
                minorStars(palace);


            let html = `

                <div class="palace-top">

                    <span class="palace-name">
                        ${nameOf(palace)}
                    </span>

                    <span class="branch">
                        ${palace.earthlyBranch || ""}
                    </span>

                </div>

                <div class="stem">
                    ${palace.heavenlyStem || ""}
                </div>

                <div class="stars">

            `;


            if(majors.length){

                majors.forEach(
                    star => {

                        const n =
                            nameOf(star);

                        const b =
                            star.brightness
                            || "";

                        const m =
                            star.mutagen
                            || "";

                        html += `

                            <span class="star
                                ${m ? "transform":""}"
                            >

                                ${n}

                                ${
                                    b
                                    ? `<span class="brightness">
                                        ${b}
                                       </span>`
                                    : ""
                                }

                                ${
                                    m
                                    ? `<span class="brightness">
                                        化${m}
                                       </span>`
                                    : ""
                                }

                            </span>

                        `;

                    }
                );

            }else{

                html += `
                    <span class="star minor">
                        空宫
                    </span>
                `;

            }


            minors.forEach(
                star => {

                    html += `

                        <span class="star minor">

                            ${nameOf(star)}

                            ${
                                star.mutagen
                                ? " 化"+star.mutagen
                                : ""
                            }

                        </span>

                    `;

                }
            );


            html += `

                </div>

                <div class="palace-footer">

                    ${
                        palace.isBodyPalace
                        ? "身宫 "
                        : ""
                    }

                    ${
                        palace.isOriginalPalace
                        ? "原命 "
                        : ""
                    }

                </div>

            `;


            div.innerHTML =
                html;


            div.addEventListener(
                "click",
                () => {

                    selectPalace(
                        idx
                    );

                }
            );


            chart.appendChild(
                div
            );

        }
    );


    const centerInfo =
        document.getElementById(
            "centerInfo"
        );


    centerInfo.innerHTML = `

        公历：
        ${ASTRO.solarDate || ""}

        <br>

        农历：
        ${ASTRO.lunarDate || ""}

        <br>

        ${ASTRO.chineseDate || ""}

        <br>

        ${ASTRO.fiveElementsClass || ""}

        <br>

        命宫：
        ${ASTRO.earthlyBranchOfSoulPalace || ""}

        <br>

        身宫：
        ${ASTRO.earthlyBranchOfBodyPalace || ""}

    `;

}

/* ==========================================================
   选择宫位
========================================================== */

function selectPalace(index){

    CURRENT_TARGET =
        index;


    document.querySelectorAll(
        ".palace"
    ).forEach(
        el => {

            el.classList.remove(
                "selected"
            );

        }
    );


    const current =
        document.querySelector(
            `.palace[data-index="${index}"]`
        );


    if(current){

        current.classList.add(
            "selected"
        );

    }


    renderPalaceMenu();


    showVirtualAnalysis(
        index,
        "命宫"
    );


    document.getElementById(
        "analysisCard"
    ).scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}

   星曜说明
========================================================== */

function renderStarEvidence(
    palace
){

    if(!palace)
        return `
            <div class="warning-box">
                没有找到该宫位。
            </div>
        `;


    let html = "";


    const majors =
        majorStars(palace);


    if(!majors.length){

        html += `

            <div class="warning-box">

                本宫为空宫。
                按传统方法不能只看空宫，
                需要把对宫星曜借入，并结合三方四正观察。

            </div>

        `;

    }


    majors.forEach(
        star => {

            const n =
                nameOf(star);

            html += `

                <div
                    class="plain"
                    style="margin-bottom:8px"
                >

                    <strong>
                        ${n}
                    </strong>

                    ${
                        star.brightness
                        ? `
                        ｜亮度：
                        ${star.brightness}
                        `
                        : ""
                    }

                    <br>

                    ${starText(star)}

                </div>

            `;

        }
    );


    return html;

}


/* ==========================================================
   辅星
========================================================== */

function renderMinorEvidence(
    palace
){

    const stars =
        minorStars(palace);


    if(!stars.length)
        return "本宫未发现辅星数据。";


    return stars
        .map(
            s => {

                const n =
                    nameOf(s);

                return `
                    <span>
                        ${n}
                        ${
                            s.mutagen
                            ? " 化"+s.mutagen
                            : ""
                        }
                    </span>
                `;

            }
        )
        .join("");

}


/* ==========================================================
   三方四正
========================================================== */

function renderSanFang(
    index
){

    const indexes =
        sanFangSiZheng(
            index
        );


    let html = `
        <div class="evidence">
    `;


    indexes.forEach(
        (idx,i) => {

            const palace =
                palaceAt(idx);


            const role =
                i === 0
                ? "本宫"
                : i === 3
                    ? "对宫"
                    : "三合";


            html += `

                <span>

                    ${role}：

                    ${nameOf(palace)}

                    ${
                        majorStars(
                            palace
                        )
                        .map(
                            s =>
                                nameOf(s)
                        )
                        .join("、")
                    }

                </span>

            `;

        }
    );


    html += `
        </div>
    `;


    return html;

}

/* ==========================================================
   自化
========================================================== */

function renderSelfMutagen(
    palace
){

    if(!palace){

        return `
            <div class="warning-box">
                无宫位数据。
            </div>
        `;

    }


    try{

        if(
            typeof palace.selfMutagedOneOf ===
            "function"
        ){

            const result =
                palace.selfMutagedOneOf();


            if(result){

                return `

                    <div class="plain">

                        检测到本宫存在自化信息：

                        <br><br>

                        <strong>
                            ${JSON.stringify(result)}
                        </strong>

                        <br><br>

                        自化应结合
                        “本宫星曜 + 自化性质 +
                        对宫 + 三方四正”
                        一起解释。

                    </div>

                `;

            }

        }

    }catch(e){

    }


    const self =
        allStars(palace)
            .filter(
                s =>
                    s.mutagen
            );


    if(!self.length){

        return `

            <div class="evidence">

                <span>
                    当前数据没有检测到明确自化标记。
                </span>

            </div>

        `;

    }


    return `

        <div class="plain">

            本宫星曜带有：

            <strong>
                ${
                    self
                        .map(
                            s =>
                                nameOf(s)
                                +
                                "化"
                                +
                                s.mutagen
                        )
                        .join("、")
                }
            </strong>

            <br><br>

            这里需要避免把“星曜生年四化”
            和“宫位自化”混为一谈；
            两者在传统飞星体系中的层级不同。

        </div>

    `;

}

/* ==========================================================
   大白话
========================================================== */

function buildPlainAnalysis(
    virtualName,
    palace,
    selectedIndex
){

    const stars =
        majorStars(palace);


    const starNames =
        stars
            .map(
                s =>
                    nameOf(s)
            );


    let points = [];


    if(starNames.length){

        starNames.forEach(
            name => {

                const key =
                    STAR_KEYWORDS[name];

                if(key){

                    points.push(
                        `${name}强调${key}`
                    );

                }

            }
        );

    }else{

        points.push(
            "本宫为空宫，因此不能只根据本宫下结论，需要借对宫并结合三方四正。"
        );

    }


    const three =
        sanFangSiZheng(
            selectedIndex
        );


    const threeNames =
        three
            .map(
                i =>
                    nameOf(
                        palaceAt(i)
                    )
            );


    let text = `

        <div class="plain">

            <strong>
                先看核心：
            </strong>

            ${virtualName}
            不能只看这一宫。

            <br><br>

            当前本宫为：

            <strong>
                ${nameOf(palace)}
            </strong>

            。

            <br>

            三方四正涉及：

            <strong>
                ${threeNames.join("、")}
            </strong>

            。

            <br><br>

            星曜层面：

            ${points.join("；")}。

            <br><br>

            这意味着真正解释时，
            应当把“宫位主题”、
            “星曜性质”、
            “亮度”、
            “辅星”、
            “三方四正”、
            “对宫”、
            “四化”、
            “大限”、
            “流年”
            放在同一个证据链里。

        </div>

    `;


    if(
        virtualName === "夫妻"
    ){

        text += `

            <div class="plain"
                style="margin-top:10px"
            >

                <strong>
                    夫妻宫专项：
                </strong>

                <br><br>

                以夫妻宫作为新的命宫以后，
                新的“命宫、官禄、财帛、
                福德、迁移”等宫位都会重新定义。

                <br><br>

                因此这里观察的不是简单的
                “夫妻宫好不好”，
                而是：

                <br>

                <strong>
                这个夫妻主题本身的结构是什么，
                它的三方四正是什么，
                什么力量进入它，
                它又把什么力量带出去。
                </strong>

            </div>

        `;

    }


    return text;

}


/* ==========================================================
   十二宫表
========================================================== */

function renderDetailTable(){

    const box =
        document.getElementById(
            "detailTable"
        );


    let html = `

        <table class="data-table">

            <thead>

                <tr>

                    <th>
                        宫位
                    </th>

                    <th>
                        宫干
                    </th>

                    <th>
                        宫支
                    </th>

                    <th>
                        主星
                    </th>

                    <th>
                        辅星
                    </th>

                    <th>
                        四化
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    ASTRO.palaces.forEach(
        palace => {

            const stars =
                majorStars(
                    palace
                )
                .map(
                    s =>
                        nameOf(s)
                )
                .join("、")
                || "—";


            const minor =
                minorStars(
                    palace
                )
                .map(
                    s =>
                        nameOf(s)
                )
                .join("、")
                || "—";


            const mutagen =
                allStars(
                    palace
                )
                .filter(
                    s =>
                        s.mutagen
                )
                .map(
                    s =>
                        nameOf(s)
                        +
                        "化"
                        +
                        s.mutagen
                )
                .join("、")
                || "—";


            html += `

                <tr>

                    <td>
                        ${nameOf(palace)}
                    </td>

                    <td>
                        ${palace.heavenlyStem || "—"}
                    </td>

                    <td>
                        ${palace.earthlyBranch || "—"}
                    </td>

                    <td>
                        ${stars}
                    </td>

                    <td>
                        ${minor}
                    </td>

                    <td>
                        ${mutagen}
                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    box.innerHTML =
        html;

}

/* ==========================================================
   开始排盘
========================================================== */

document.getElementById(
    "calcBtn"
).addEventListener(
    "click",
    () => {


        /*
           先检查 iztro
        */

        if(
            typeof window.iztro ===
            "undefined"
        ){

            status(
                "排盘引擎没有加载。请确认 GitHub 根目录存在 iztro-v2.6.1.min.js。",
                "error"
            );

            return;

        }


        const date =
            document.getElementById(
                "birthDate"
            ).value;


        const time =
            document.getElementById(
                "birthTime"
            ).value;


        const gender =
            document.getElementById(
                "gender"
            ).value;


        const targetYear =
            Number(
                document.getElementById(
                    "targetYear"
                ).value
            );


        if(!date){

            status(
                "请选择出生公历日期。",
                "error"
            );

            return;

        }


        if(!time){

            status(
                "请选择出生时间。",
                "error"
            );

            return;

        }


        if(!gender){

            status(
                "请选择性别。",
                "error"
            );

            return;

        }


        if(
            !targetYear ||
            targetYear < 1900 ||
            targetYear > 2200
        ){

            status(
                "请输入有效的流年年份。",
                "error"
            );

            return;

        }


        try{

            const hour =
                Number(
                    time.split(":")[0]
                );


            const minute =
                Number(
                    time.split(":")[1]
                );


            const timeIndex =
                hourToTimeIndex(
                    hour
                );


            /*
              iztro 官方阳历排盘
            */

            ASTRO =
                window.iztro.astro.bySolar(
                    date,
                    timeIndex,
                    gender,
                    true,
                    "zh-CN"
                );


            /*
              大限 / 流年
            */

            HOROSCOPE =
                ASTRO.horoscope(
                    `${targetYear}-01-01`
                );


            /*
              显示
            */

            document.getElementById(
                "chartCard"
            ).style.display =
                "block";


            document.getElementById(
                "transformCard"
            ).style.display =
                "block";


            document.getElementById(
                "horizonCard"
            ).style.display =
                "block";


            document.getElementById(
                "analysisCard"
            ).style.display =
                "block";


            document.getElementById(
                "detailCard"
            ).style.display =
                "block";


            buildChart();

            renderTransformations();

            renderHorizon();

            renderDetailTable();


            /*
              默认选择命宫
            */

            const soulIndex =
                ASTRO.palaces.findIndex(
                    p =>
                        p.isOriginalPalace
                );


            CURRENT_TARGET =
                soulIndex >= 0
                ? soulIndex
                : 0;


            selectPalace(
                CURRENT_TARGET
            );


            status(
                "排盘完成。点击十二宫可以进入主题宫分析。",
                "ok"
            );


        }catch(error){

            console.error(
                error
            );


            status(
                "排盘失败：" +
                (
                    error?.message
                    || String(error)
                ),
                "error"
            );

        }

    }
);
